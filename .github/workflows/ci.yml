name: CI

on:
  push:
    branches: [main]
  pull_request:

# lint -> type check -> tests -> coverage -> build.
# One job, ordered steps -> the order above is guaranteed by construction.
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- lint ----
      - name: Lint
        run: npm run lint

      # ---- type check ----
      - name: Type-check
        run: npx tsc -b

      # ---- tests ----
      - name: Tests
        run: npm run test

      # ---- coverage ----
      - name: Coverage
        run: npm run test:coverage

      # ---- build ----
      # Real production values, not placeholders: VITE_API_BASE_URL is
      # a relative path (see cdis-deployment's reverse proxy, which
      # routes /api/* to the backend on the same origin) — resolves
      # correctly regardless of the frontend's actual public URL, so
      # this Dockerfile's build args are its real, permanent value.
      - name: Build
        run: npm run build
        env:
          VITE_APP_NAME: CDIS
          VITE_APP_ENV: production
          VITE_API_BASE_URL: /api/v1

  # Only runs after every quality gate above passes, and only for
  # pushes to main (never for PRs from forks, which can't safely hold
  # package-write credentials) — build once here, deploy the resulting
  # artifact everywhere else. Tagged by commit SHA, never only `latest`,
  # so a specific version can always be pinned and rolled back to.
  build-and-push:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU lets buildx cross-compile for arm64 on this (amd64) runner
      # — the target server's CPU architecture isn't locked in yet
      # (Oracle Cloud Always Free may land on Ampere ARM or x86
      # depending on regional capacity), so both are built and pushed
      # as one multi-platform image rather than guessing.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_APP_NAME=CDIS
            VITE_APP_ENV=production
            VITE_API_BASE_URL=/api/v1
          tags: |
            ghcr.io/workgaurav1/cdis-frontend:${{ github.sha }}
            ghcr.io/workgaurav1/cdis-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
